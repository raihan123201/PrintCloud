<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrintCloud - Layanan Cetak Online</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 50px auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #3e64ff;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background: #3e64ff;
      color: white;
      border: none;
      margin-top: 20px;
      cursor: pointer;
    }
    button:hover {
      background: #2c4edb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>PrintCloud Kelompok 6</h1>
    <form action="process.php" method="POST" enctype="multipart/form-data">
      <label for="nama">Nama Lengkap:</label>
      <input type="text" id="nama" name="nama" required><label for="email">Email:</label>
  <input type="email" id="email" name="email" required>

  <label for="file">Upload Dokumen (PDF/Word):</label>
  <input type="file" id="file" name="file" accept=".pdf,.doc,.docx" required>

  <label for="jenis">Jenis Cetak:</label>
  <select id="jenis" name="jenis">
    <option value="bw">Hitam Putih</option>
    <option value="color">Berwarna</option>
  </select>

  <label for="sisi">Cetak Satu/Dua Sisi:</label>
  <select id="sisi" name="sisi">
    <option value="1">Satu Sisi</option>
    <option value="2">Dua Sisi</option>
  </select>

  <label for="pengambilan">Opsi Pengambilan:</label>
  <select id="pengambilan" name="pengambilan">
    <option value="ambil">Ambil di Tempat</option>
    <option value="kirim">Kirim ke Alamat</option>
  </select>

  <button type="submit">Kirim dan Cetak</button>
</form>

  </div>
</body>
</html>
